<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yara Campus AI Assistant</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
    }

    .header {
      background: #4f46e5;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .chat-box {
      margin: 20px;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .message {
      padding: 12px;
      margin: 10px 0;
      border-radius: 12px;
    }

    .bot {
      background: #eef2ff;
    }

    .user {
      background: #dbeafe;
      text-align: right;
    }
  </style>
</head>
<body>

  <div class="header">AI Assistant</div>

  <div class="chat-box">
    <div class="message bot">Hello! I'm Yara Campus AI Assistant 👋</div>
    <div class="message user">Show my assignments</div>
    <div class="message bot">You have 3 pending assignments this week.</div>
  </div>

</body>
</html>
