<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Yara Campus</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: #1e293b;
      padding: 40px;
      border-radius: 12px;
      width: 300px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #38bdf8;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0ea5e9;
    }

    a {
      color: #94a3b8;
      font-size: 12px;
      display: block;
      margin-top: 10px;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>🔐 Login</h2>

  <input type="text" placeholder="Username">
  <input type="password" placeholder="Password">

  <button onclick="login()">Enter</button>

  <a href="index.html">⬅ Back to Dashboard</a>
</div>

<script>
function login() {
  alert("Login successful 🚀 (demo mode)");
  window.location.href = "index.html";
}
</script>

</body>
</html>
