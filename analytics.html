<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yara Campus - Analytics</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
    }

    .navbar {
      background: #4f46e5;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h2 {
      margin-top: 0;
      color: #333;
    }

    .number {
      font-size: 32px;
      font-weight: bold;
      color: #4f46e5;
    }
  </style>
</head>
<body>

  <div class="navbar">Analytics Dashboard</div>

  <div class="container">
    <div class="card">
      <h2>Total Students</h2>
      <div class="number">1,245</div>
    </div>

    <div class="card">
      <h2>Courses Active</h2>
      <div class="number">38</div>
    </div>

    <div class="card">
      <h2>Assignments Submitted</h2>
      <div class="number">5,920</div>
    </div>
  </div>

</body>
</html>
