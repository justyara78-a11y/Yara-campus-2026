<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Yara Campus Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
    }

    header {
      background: #1e293b;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    .container {
      padding: 40px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }

    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      text-decoration: none;
      color: white;
      transition: 0.3s;
    }

    .card:hover {
      background: #334155;
      transform: scale(1.05);
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

<header>
  <h1>🎓 Yara Campus</h1>
  <a href="login.html" style="color:#38bdf8; text-decoration:none;">Login</a>
</header>

<div class="container">
  <h2>Welcome Back 👋</h2>
  <p>Manage your studies in one place</p>

  <div class="grid">
    <a class="card" href="courses.html">📚 Courses</a>
    <a class="card" href="students.html">👩‍🎓 Students</a>
    <a class="card" href="assignments.html">📝 Assignments</a>
  </div>
</div>

<footer>
  © 2026 Yara Campus
</footer>

</body>
</html>
