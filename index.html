<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yara Campus</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    /* HEADER */
    header {
      background: #1e293b;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    nav a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
    }

    /* HERO */
    .hero {
      text-align: center;
      padding: 60px 20px;
    }

    .hero h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .btn {
      padding: 12px 25px;
      background: #38bdf8;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    .btn:hover {
      background: #0ea5e9;
    }

    /* CARDS */
    .container {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 40px;
      flex-wrap: wrap;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      width: 220px;
      border-radius: 12px;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #1e293b;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <h1>Yara Campus</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Courses</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- HERO -->
  <div class="hero">
    <h2>Welcome to Yara Campus</h2>
    <p>Learn. Grow. Succeed.</p>

    <button class="btn"
      onclick="window.location.href='https://docs.google.com/forms/xxxxx'">
      Start Now
    </button>
  </div>

  <!-- CARDS -->
  <div class="container">
    <div class="card">📚 Courses</div>
    <div class="card">🎓 Students</div>
    <div class="card">🌐 Community</div>
  </div>

  <!-- FOOTER -->
  <footer>
    © 2026 Yara Campus
  </footer>

</body>
</html>
