<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Yara Campus Dashboard</title>

  <style>
    body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
color: white;

    header {
      background: #1e293b;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    .container {
      padding: 40px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }

    .card {
  background: #1e293b;
  color: white;
  padding: 20px;
  border-radius: 16px;
  border: 1px solid #334155;
  box-shadow: 0 8px 25px rgba(0,0,0,0.3);
  transition: 0.3s;
} 

    .card:hover {
  transform: translateY(-5px);
} 

    footer {
      text-align: center;
      padding: 20px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

<header>
  <h1>🎓 Yara Campus</h1>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">

<div class="grid">
  <a class="card" href="courses.html">📚 Courses</a>
  <a class="card" href="students.html">👩‍🎓 Students</a>
  <a class="card" href="assignments.html">📝 Assignments</a>
  <a class="card" href="profile.html">👤 Profile</a><a class="card" href="schedule.html">📅 Schedule</a>
<a class="card" href="analytics.html">📊 Analytics</a>
<a class="card" href="ai-assistant.html">🤖 AI Assistant</a>
</div>
</div>

<footer>
  © 2026 Yara Campus
</footer>

</body>
</html>
