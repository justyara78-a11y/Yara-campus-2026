<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yara Campus AI</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
}

header {
  background: #1e293b;
  padding: 20px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

nav {
  display: flex;
  justify-content: space-around;
  background: #111827;
  padding: 15px;
}

nav button {
  background: none;
  border: none;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.section {
  display: none;
  padding: 20px;
}

.active {
  display: block;
}

.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}

input, button.action {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
}

button.action {
  background: #38bdf8;
  font-weight: bold;
  cursor: pointer;
}

#response {
  margin-top: 10px;
  background: #0b1220;
  padding: 10px;
  border-radius: 10px;
}
</style>
</head>

<header>
🎓 Yara Campus AI
</header>
