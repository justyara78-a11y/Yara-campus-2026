 <!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yara Campus AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: #1e293b;
      padding: 18px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    main {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 12px;
    }

    h3 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      margin-top: 10px;
    }

    button {
      margin-top: 10px;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 10px;
      background: #38bdf8;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:active {
      transform: scale(0.97);
    }

    #response {
      margin-top: 10px;
      padding: 10px;
      background: #0b1220;
      border-radius: 10px;
      min-height: 50px;
    }

    footer {
      text-align: center;
      padding: 10px;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <header>
    🎓 Yara Campus AI
  </header>

  <main>

    <!-- Courses -->
    <div class="card">
      <h3>📚 Courses</h3>
      <p>✔ Math</p>
      <p>✔ English</p>
      <p>✔ Computer Science</p>
    </div>

    <!-- AI Section -->
    <div class="card">
      <h3>🤖 Study AI Assistant</h3>

      <input id="userInput" type="text" placeholder="Ask: math, study, exam, plan...">

      <button onclick="sendMessage()">Ask AI</button>

      <div id="response">AI will answer here...</div>
    </div>

  </main>

  <footer>
    Made for students ❤️
  </footer>

  <script>
    function sendMessage() {
      let input = document.getElementById("userInput").value.toLowerCase();
      let response = "";

      if (input.includes("hello") || input.includes("hi")) {
        response = "👋 Hello student! Ready to study?";
      }
      else if (input.includes("math")) {
        response = "📚 Math tip: Practice daily exercises and understand formulas.";
      }
      else if (input.includes("english")) {
        response = "📖 English tip: Learn 10 words per day + read short texts.";
      }
      else if (input.includes("exam")) {
        response = "📝 Exam tip: Revise summaries and solve past exams.";
      }
      else if (input.includes("plan")) {
        response = "📅 Study plan: 2h study + 30min break + repeat.";
      }
      else if (input.includes("study")) {
        response = "📖 Study tip: Use Pomodoro technique (25min study / 5min break).";
      }
      else {
        response = "🤖 Try: math / english / exam / plan / study";
      }

      document.getElementById("response").innerText = response;
    }
  </script>

</body>

</html>>
