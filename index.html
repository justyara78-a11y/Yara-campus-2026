 <!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI App</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    header {
      background: #1e293b;
      padding: 18px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    main {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 12px;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #38bdf8;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0ea5e9;
    }

    input {
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
    }

    footer {
      text-align: center;
      padding: 10px;
      font-size: 12px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <header>
    🤖 My AI App
  </header>

  <main>

    <div class="card">
      <h3>Ask AI</h3>
      <input type="text" placeholder="Type something...">
      <br><br>
      <button>Send</button>
    </div>

    <div class="card">
      <h3>Quick Buttons</h3>
      <button>AI Chat</button>
      <button>Generate</button>
      <button>Help</button>
    </div>

  </main>

  <footer>
    Made with ❤️
  </footer>

</body>

</html>
