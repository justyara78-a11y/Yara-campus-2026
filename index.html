<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yara Campus AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: #1e293b;
      padding: 18px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    main {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 12px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      margin-top: 10px;
    }

    button {
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #38bdf8;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0ea5e9;
    }

    #response {
      margin-top: 10px;
      padding: 10px;
      background: #0b1220;
      border-radius: 10px;
      min-height: 40px;
    }

    footer {
      text-align: center;
      padding: 10px;
      font-size: 12px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <header>
    🎓 Yara Campus AI
  </header>

  <main>

    <div class="card">
      <h3>📚 AI Study Assistant</h3>

      <input id="userInput" type="text" placeholder="Ask something (math, study, hello...)">

      <button onclick="sendMessage()">Send</button>

      <div id="response">🤖 AI response will appear here...</div>
    </div>

  </main>

  <footer>
    Made for students ❤️
  </footer>

  <script>
    function sendMessage() {
      let input = document.getElementById("userInput").value.toLowerCase();
      let response = "";

      }
